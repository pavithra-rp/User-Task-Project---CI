name: FastAPI CI Pipeline

# when CI should run: every push and pull request
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# tasks to execute
jobs:
  test:
    runs-on: ubuntu-latest  # Creates temporary Ubuntu machine in GitHub server
    env:
      DATABASE_URL: sqlite:///./test_db
    steps:
      - name: Checkout Action  
      # prebuilt reusable action provided by Github
        uses: actions/checkout@v4    # temp machine - Download your repository code into the CI runner machine
      
      - name: Setup python
        uses: actions/setup-python@v5  # Install Python
        with:
          python-version: "3.11"
      
      - name: Install Dependencies
        run: |  # | symbol for multiline read
          pip install -r requirements.txt   # Install dependencies

      - name: Run Tests
        run: pytest   # Run pytest

  # Pull request -> Only Test
  # Push to main -> Test + Deploy
  deploy:
    needs: test
    if: github.event_name == 'push'  # deploy only for push
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Dependencies
        run: pip install -r requirements.txt        
      - name: Make startup.sh executable
        run: chmod +x startup.sh
      - name: Deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: user-task-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: .